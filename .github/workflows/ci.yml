# Checks for pull requests into main, pushes to main, and manual runs.
# contents: read only. No deploy, no production secrets, no Supabase.
#
# Node is 22.23.4 because the lockfile rejects Node 20:
#   vitest@5.1.0                         ^22.12.0 || ^24.0.0 || >=26.0.0
#   @supabase/supabase-js@2.118.0        >=22.0.0
#   @napi-rs/lzma-linux-x64-gnu (rollup) ^22.20 || ^24.12 || >=25
#
# SQL uses a throwaway postgres:17 service. The official image does not
# ship pg_cron (CREATE EXTENSION fails: control file missing). The job
# installs postgresql-17-cron inside that container and preloads it.
# pg_cron 1.6 can be created only in cron.database_name, so the suite
# runs in place on that container's postgres database.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Dummy values so the build does not read a developer .env.
          # example.supabase.co is not a project. The key is not real.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

  sql:
    name: SQL suite on throwaway Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install pg_cron into the Postgres service
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$CONTAINER_ID" bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-17-cron'
          docker exec "$CONTAINER_ID" bash -c 'grep -q "^shared_preload_libraries" "$PGDATA/postgresql.conf" || printf "%s\n" "shared_preload_libraries = '\''pg_cron'\''" "cron.database_name = '\''postgres'\''" >> "$PGDATA/postgresql.conf"'
          docker restart "$CONTAINER_ID"
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$CONTAINER_ID" pg_isready -U postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: postgres did not accept connections after pg_cron preload restart"
            exit 1
          fi
          docker exec "$CONTAINER_ID" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "show server_version;" \
            -c "show shared_preload_libraries;" \
            -c "create extension if not exists pg_cron;" \
            -c "select extversion from pg_extension where extname = 'pg_cron';" \
            -c "drop extension pg_cron;"

      - name: Install dependencies
        run: npm ci

      - name: SQL suite
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          WF_SQL_IN_PLACE: '1'
        run: tests/run-sql-tests.sh
